[build]
  publish = "."

[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
